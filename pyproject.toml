[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ff-decomposition-experiments"
version = "0.1.0"
description = "Reproducible experiments for decomposing supervised Forward-Forward learning"
requires-python = ">=3.10"
dependencies = [
    "medmnist>=3.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "Pillow>=9.0",
    "torch>=2.3",
    "torchvision>=0.18",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
ff-decomposition-mlp = "MLPBenchmarkSuite:main"
broad-mlp-benchmark = "BroadMLPBenchmarkScheduler:main"
ff-matched-control = "MatchedLocalityControlScheduler:main"
ce-matched-control = "MatchedCELocalityControlScheduler:main"
ff-normalization-ablation = "NormalizationAblationScheduler:main"
local-bp-cnn = "LocalBPCNNBenchmark:main"
matched-cnn-local-bp = "MatchedCNNLocalBPBenchmarkScheduler:main"
local-bp-mixer = "MLPMixerBenchmarkSuite:main"
reduced-local-bp-mixer = "ReducedMixerBenchmarkScheduler:main"
ff-reconstruction-probe = "ReconstructionProbe:main"
ff-reconstruction-experiment = "ReconstructionExperimentScheduler:main"

[tool.setuptools]
py-modules = [
    "decomposition_core",
    "MLPBenchmarkSuite",
    "BroadMLPBenchmarkScheduler",
    "MatchedLocalityControlScheduler",
    "MatchedCELocalityControlScheduler",
    "NormalizationAblationScheduler",
    "LocalBPCNNBenchmark",
    "MatchedCNNLocalBPBenchmarkScheduler",
    "medmnist_support",
    "MLPMixerBenchmarkSuite",
    "ReducedMixerBenchmarkScheduler",
    "ReconstructionProbe",
    "ReconstructionExperimentScheduler",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
